<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification - Intranet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .input-field {
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .success-message {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10000;
            animation: slideIn 0.5s ease;
        }
        
        .error-message {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10000;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="min-h-screen flex items-center justify-center">
        <div class="glass-card p-8 w-full max-w-md">
            <!-- Logo et Titre -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-shield-alt text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Intranet - Authentification</h1>
                <p class="text-gray-600 mt-2">Système de gestion sécurisé</p>
            </div>

            <!-- Formulaire de Connexion -->
            <div id="loginForm">
                <form id="formLogin">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user mr-2"></i>Nom d'utilisateur
                        </label>
                        <input type="text" id="loginUsername" required
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Entrez votre nom d'utilisateur">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Mot de passe (1-6 chiffres)
                        </label>
                        <input type="password" id="loginPassword" required maxlength="6"
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Entrez votre mot de passe">
                    </div>
                    
                    <button type="submit" 
                        class="btn-primary w-full text-white py-3 rounded-lg font-semibold">
                        <i class="fas fa-sign-in-alt mr-2"></i>Se Connecter
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-gray-600">Première connexion?</p>
                    <button type="button" id="btnCreateAccount"
                        class="text-purple-600 hover:text-purple-800 font-semibold underline">
                        <i class="fas fa-user-plus mr-1"></i>Créer un compte
                    </button>
                </div>
            </div>

            <!-- Formulaire de Création de Compte -->
            <div id="createAccountForm" class="hidden">
                <form id="formCreateAccount">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user mr-2"></i>Nom d'utilisateur *
                        </label>
                        <input type="text" id="newUsername" required
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Choisissez un nom d'utilisateur">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Mot de passe (1-6 chiffres) *
                        </label>
                        <input type="password" id="newPassword" required maxlength="6" pattern="[0-9]{1,6}"
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Choisissez un mot de passe (1-6 chiffres)">
                        <p class="text-xs text-gray-500 mt-1">Le mot de passe doit contenir entre 1 et 6 chiffres</p>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Confirmer le mot de passe *
                        </label>
                        <input type="password" id="confirmPassword" required maxlength="6" pattern="[0-9]{1,6}"
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Confirmez votre mot de passe">
                    </div>
                    
                    <button type="submit" 
                        class="btn-primary w-full text-white py-3 rounded-lg font-semibold">
                        <i class="fas fa-user-plus mr-2"></i>Créer le Compte
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <button type="button" id="btnBackToLogin"
                        class="text-purple-600 hover:text-purple-800 font-semibold underline">
                        <i class="fas fa-arrow-left mr-1"></i>Retour à la connexion
                    </button>
                </div>
            </div>

            <!-- Formulaire de Modification du Mot de Passe -->
            <div id="changePasswordForm" class="hidden">
                <form id="formChangePassword">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Ancien mot de passe *
                        </label>
                        <input type="password" id="oldPassword" required maxlength="6"
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Entrez votre ancien mot de passe">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Nouveau mot de passe (1-6 chiffres) *
                        </label>
                        <input type="password" id="newPasswordChange" required maxlength="6" pattern="[0-9]{1,6}"
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Nouveau mot de passe (1-6 chiffres)">
                        <p class="text-xs text-gray-500 mt-1">Le mot de passe doit contenir entre 1 et 6 chiffres</p>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Confirmer le nouveau mot de passe *
                        </label>
                        <input type="password" id="confirmPasswordChange" required maxlength="6" pattern="[0-9]{1,6}"
                            class="input-field w-full px-4 py-3 border border-gray-300 rounded-lg"
                            placeholder="Confirmez le nouveau mot de passe">
                    </div>
                    
                    <button type="submit" 
                        class="btn-primary w-full text-white py-3 rounded-lg font-semibold">
                        <i class="fas fa-key mr-2"></i>Modifier le Mot de Passe
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <button type="button" id="btnBackToLoginFromChange"
                        class="text-purple-600 hover:text-purple-800 font-semibold underline">
                        <i class="fas fa-arrow-left mr-1"></i>Retour à la connexion
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="successMessage">
        <div class="flex items-center">
            <i class="fas fa-check-circle text-2xl mr-3"></i>
            <div>
                <p class="font-semibold">Succès!</p>
                <p class="text-sm" id="successText">Opération effectuée avec succès</p>
            </div>
        </div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage">
        <div class="flex items-center">
            <i class="fas fa-exclamation-circle text-2xl mr-3"></i>
            <div>
                <p class="font-semibold">Erreur!</p>
                <p class="text-sm" id="errorText">Une erreur est survenue</p>
            </div>
        </div>
    </div>

    <script>
        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            checkFirstLogin();
            checkChangePasswordParam();
        });

        // Vérifier si c'est la première connexion (pas d'utilisateurs)
        function checkFirstLogin() {
            const users = JSON.parse(localStorage.getItem('intranetUsers') || '[]');
            if (users.length === 0) {
                // Afficher le formulaire de création de compte
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('createAccountForm').classList.remove('hidden');
            }
        }

        // Vérifier le paramètre changePassword dans l'URL
        function checkChangePasswordParam() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('changePassword') === 'true') {
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                if (currentUser.username) {
                    showChangePasswordForm();
                } else {
                    // Rediriger vers la page de connexion si pas d'utilisateur connecté
                    window.location.href = 'auth.html';
                }
            }
        }

        // Initialiser les écouteurs d'événements
        function initializeEventListeners() {
            document.getElementById('btnCreateAccount').addEventListener('click', showCreateAccountForm);
            document.getElementById('btnBackToLogin').addEventListener('click', showLoginForm);
            document.getElementById('btnBackToLoginFromChange').addEventListener('click', showLoginForm);
            document.getElementById('formLogin').addEventListener('submit', handleLogin);
            document.getElementById('formCreateAccount').addEventListener('submit', handleCreateAccount);
            document.getElementById('formChangePassword').addEventListener('submit', handleChangePassword);
        }

        // Afficher le formulaire de création de compte
        function showCreateAccountForm() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('createAccountForm').classList.remove('hidden');
            document.getElementById('changePasswordForm').classList.add('hidden');
        }

        // Afficher le formulaire de connexion
        function showLoginForm() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('createAccountForm').classList.add('hidden');
            document.getElementById('changePasswordForm').classList.add('hidden');
        }

        // Afficher le formulaire de modification de mot de passe
        function showChangePasswordForm() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('createAccountForm').classList.add('hidden');
            document.getElementById('changePasswordForm').classList.remove('hidden');
        }

        // Gérer la connexion
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Validation du mot de passe (1-6 chiffres)
            if (!/^[0-9]{1,6}$/.test(password)) {
                showError('Le mot de passe doit contenir entre 1 et 6 chiffres');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('intranetUsers') || '[]');
            const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
            
            if (user) {
                // Stocker la session
                localStorage.setItem('currentUser', JSON.stringify(user));
                showSuccess('Connexion réussie!');
                
                // Rediriger vers la page principale
                setTimeout(() => {
                    window.location.href = 'intranet-formulaire.html';
                }, 1000);
            } else {
                showError('Nom d\'utilisateur ou mot de passe incorrect');
            }
        }

        // Gérer la création de compte
        function handleCreateAccount(event) {
            event.preventDefault();
            
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation du mot de passe (1-6 chiffres)
            if (!/^[0-9]{1,6}$/.test(password)) {
                showError('Le mot de passe doit contenir entre 1 et 6 chiffres');
                return;
            }
            
            // Vérifier que les mots de passe correspondent
            if (password !== confirmPassword) {
                showError('Les mots de passe ne correspondent pas');
                return;
            }
            
            // Vérifier que le nom d'utilisateur n'existe pas déjà
            const users = JSON.parse(localStorage.getItem('intranetUsers') || '[]');
            if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
                showError('Ce nom d\'utilisateur existe déjà');
                return;
            }
            
            // Créer le nouvel utilisateur
            const newUser = {
                id: Date.now(),
                username: username,
                password: password,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('intranetUsers', JSON.stringify(users));
            
            showSuccess('Compte créé avec succès!');
            
            // Réinitialiser le formulaire
            document.getElementById('formCreateAccount').reset();
            
            // Rediriger vers la connexion
            setTimeout(() => {
                showLoginForm();
            }, 1500);
        }

        // Gérer la modification du mot de passe
        function handleChangePassword(event) {
            event.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPasswordChange').value;
            const confirmPassword = document.getElementById('confirmPasswordChange').value;
            
            // Validation du nouveau mot de passe (1-6 chiffres)
            if (!/^[0-9]{1,6}$/.test(newPassword)) {
                showError('Le nouveau mot de passe doit contenir entre 1 et 6 chiffres');
                return;
            }
            
            // Vérifier que les nouveaux mots de passe correspondent
            if (newPassword !== confirmPassword) {
                showError('Les nouveaux mots de passe ne correspondent pas');
                return;
            }
            
            // Récupérer l'utilisateur actuel
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            
            if (!currentUser.username || oldPassword !== currentUser.password) {
                showError('Ancien mot de passe incorrect');
                return;
            }
            
            // Mettre à jour le mot de passe
            const users = JSON.parse(localStorage.getItem('intranetUsers') || '[]');
            const userIndex = users.findIndex(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
            
            if (userIndex !== -1) {
                users[userIndex].password = newPassword;
                users[userIndex].passwordChangedAt = new Date().toISOString();
                localStorage.setItem('intranetUsers', JSON.stringify(users));
                
                // Mettre à jour la session
                currentUser.password = newPassword;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                showSuccess('Mot de passe modifié avec succès!');
                
                // Réinitialiser le formulaire
                document.getElementById('formChangePassword').reset();
                
                // Rediriger vers la page principale
                setTimeout(() => {
                    window.location.href = 'intranet-formulaire.html';
                }, 1500);
            } else {
                showError('Utilisateur non trouvé');
            }
        }

        // Afficher le message de succès
        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            document.getElementById('successText').textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        // Afficher le message d'erreur
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
