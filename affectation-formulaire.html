<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplitude - Gestion Affectation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .form-section {
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin-bottom: 30px;
        }
        
        .form-section h3 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        select, input, textarea {
            transition: all 0.3s ease;
        }
        
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transition: all 0.3s ease;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            transition: all 0.3s ease;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        
        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="glass-card p-6 mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">
                        <i class="fas fa-user-plus mr-3 text-purple-600"></i>
                        Amplitude - Gestion Affectation
                    </h1>
                    <p class="text-gray-600 mt-2">Système de gestion des affectations</p>
                </div>
                <div class="flex items-center space-x-6">
                    <div class="text-right">
                        <p class="text-sm text-gray-500">Date du jour</p>
                        <p class="text-lg font-semibold text-gray-800" id="currentDate"></p>
                    </div>
                    <a href="intranet-formulaire.html" class="text-purple-600 hover:text-purple-800">
                        <i class="fas fa-arrow-left mr-2"></i>Retour
                    </a>
                </div>
            </div>
        </div>

        <!-- Formulaire Principal -->
        <div class="glass-card p-8">
            <form id="affectationForm">
                <!-- Informations Générales -->
                <div class="form-section">
                    <h3><i class="fas fa-info-circle mr-2"></i>Informations Générales</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Date Affectation *</label>
                            <input type="date" id="dateAffectation" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Date Création *</label>
                            <input type="date" id="dateCreation" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        </div>
                    </div>
                </div>

                <!-- Localisation -->
                <div class="form-section">
                    <h3><i class="fas fa-map-marker-alt mr-2"></i>Localisation</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Région *</label>
                            <select id="region" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                <option value="">Sélectionner une région</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Supervision *</label>
                            <select id="supervision" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500" disabled>
                                <option value="">Sélectionner une supervision</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Agence *</label>
                            <select id="agence" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500" disabled>
                                <option value="">Sélectionner une agence</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Informations Gestionnaire -->
                <div class="form-section">
                    <h3><i class="fas fa-user-tie mr-2"></i>Informations Gestionnaire</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nom & Prénom *</label>
                            <input type="text" id="nomPrenom" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                placeholder="Entrez le nom et prénom">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Matricule *</label>
                            <input type="text" id="matricule" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                placeholder="Entrez le matricule">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Code Gestionnaire *</label>
                            <input type="text" id="codeGestionnaire" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                placeholder="Entrez le code gestionnaire">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Code Caisse *</label>
                            <select id="codeCaisse" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                <option value="">Sélectionner un code caisse</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Boutons d'action -->
                <div class="flex flex-wrap gap-4 mt-8">
                    <button type="button" onclick="handleSave()"
                        class="btn-primary text-white px-6 py-3 rounded-lg font-semibold flex items-center">
                        <i class="fas fa-save mr-2"></i>Sauvegarder
                    </button>
                    <button type="button" onclick="handleExport()"
                        class="btn-success text-white px-6 py-3 rounded-lg font-semibold flex items-center">
                        <i class="fas fa-file-excel mr-2"></i>Exporter Excel
                    </button>
                    <button type="button" onclick="handleReset()"
                        class="btn-danger text-white px-6 py-3 rounded-lg font-semibold flex items-center">
                        <i class="fas fa-redo mr-2"></i>Réinitialiser
                    </button>
                </div>
            </form>
        </div>

        <!-- Success Message -->
        <div class="success-message hidden" id="successMessage">
            <div class="flex items-center">
                <i class="fas fa-check-circle text-2xl mr-3"></i>
                <div>
                    <p class="font-semibold">Succès!</p>
                    <p class="text-sm" id="successText">Opération effectuée avec succès</p>
                </div>
            </div>
        </div>
    </div>

                           { id: 369, nom: 'Agence KENITRA EL MELLAH  '}
                           
                    


                ],
            }
        };

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            initializeDate();
            initializeCascadeDropdowns();
            initializeEventListeners();
        });

        // Initialiser la date du jour
        function initializeDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('fr-FR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('dateCreation').value = today;
        }

        // Initialiser les dropdowns en cascade
        function initializeCascadeDropdowns() {
            const regionSelect = document.getElementById('region');
            
            // Remplir les régions
            CASCADE_DATA.regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region.id;
                option.textContent = region.nom;
                regionSelect.appendChild(option);
            });

            // Écouteur pour le changement de région
            regionSelect.addEventListener('change', function() {
                const regionId = parseInt(this.value);
                const supervisionSelect = document.getElementById('supervision');
                const agenceSelect = document.getElementById('agence');
                
                // Réinitialiser
                supervisionSelect.innerHTML = '<option value="">Sélectionner une supervision</option>';
                supervisionSelect.disabled = true;
                agenceSelect.innerHTML = '<option value="">Sélectionner une agence</option>';
                agenceSelect.disabled = true;

                if (regionId && CASCADE_DATA.supervisions[regionId]) {
                    CASCADE_DATA.supervisions[regionId].forEach(supervision => {
                        const option = document.createElement('option');
                        option.value = supervision.id;
                        option.textContent = supervision.nom;
                        supervisionSelect.appendChild(option);
                    });
                    supervisionSelect.disabled = false;
                }
            });

            // Écouteur pour le changement de supervision
            document.getElementById('supervision').addEventListener('change', function() {
                const supervisionId = parseInt(this.value);
                const agenceSelect = document.getElementById('agence');
                
                // Réinitialiser
                agenceSelect.innerHTML = '<option value="">Sélectionner une agence</option>';
                agenceSelect.disabled = true;

                if (supervisionId && CASCADE_DATA.agences[supervisionId]) {
                    CASCADE_DATA.agences[supervisionId].forEach(agence => {
                        const option = document.createElement('option');
                        option.value = agence.id;
                        option.textContent = agence.nom;
                        agenceSelect.appendChild(option);
                    });
                    agenceSelect.disabled = false;
                }
            });
        }

        // Initialiser les écouteurs d'événements
        function initializeEventListeners() {
            // Ajouter d'autres écouteurs si nécessaire
        }

        // Sauvegarder les données localement
        function handleSave() {
            const formData = {
                dateAffectation: document.getElementById('dateAffectation').value,
                dateCreation: document.getElementById('dateCreation').value,
                region: document.getElementById('region').options[document.getElementById('region').selectedIndex].text,
                supervision: document.getElementById('supervision').options[document.getElementById('supervision').selectedIndex].text,
                agence: document.getElementById('agence').options[document.getElementById('agence').selectedIndex].text,
                nomPrenom: document.getElementById('nomPrenom').value,
                matricule: document.getElementById('matricule').value,
                codeGestionnaire: document.getElementById('codeGestionnaire').value,
                codeCaisse: document.getElementById('codeCaisse').value
            };

            // Validation basique
            if (!formData.dateAffectation || !formData.region || !formData.nomPrenom || !formData.matricule || !formData.codeGestionnaire || !formData.codeCaisse) {
                alert('Veuillez remplir tous les champs obligatoires');
                return;
            }

            // Sauvegarder dans localStorage
            let affectations = JSON.parse(localStorage.getItem('affectations') || '[]');
            affectations.push(formData);
            localStorage.setItem('affectations', JSON.stringify(affectations));

            showSuccess('Affectation sauvegardée avec succès!');
        }

        // Exporter en Excel (Mode standalone sans serveur backend)
        async function handleExport() {
            const formData = {
                dateAffectation: document.getElementById('dateAffectation').value,
                dateCreation: document.getElementById('dateCreation').value,
                region: document.getElementById('region').options[document.getElementById('region').selectedIndex].text,
                supervision: document.getElementById('supervision').options[document.getElementById('supervision').selectedIndex].text,
                agence: document.getElementById('agence').options[document.getElementById('agence').selectedIndex].text,
                nomPrenom: document.getElementById('nomPrenom').value,
                matricule: document.getElementById('matricule').value,
                codeGestionnaire: document.getElementById('codeGestionnaire').value,
                codeCaisse: document.getElementById('codeCaisse').value
            };

            // Validation basique
            if (!formData.dateAffectation || !formData.region || !formData.nomPrenom || !formData.matricule || !formData.codeGestionnaire || !formData.codeCaisse) {
                alert('Veuillez remplir tous les champs obligatoires');
                return;
            }

            // Récupérer les données accumulées depuis localStorage
            let accumulatedData = JSON.parse(localStorage.getItem('affectationsExports') || '[]');
            
            // Ajouter la nouvelle affectation aux données accumulées
            accumulatedData.push(formData);
            
            // Sauvegarder dans localStorage
            localStorage.setItem('affectationsExports', JSON.stringify(accumulatedData));

            // Export direct en Excel côté client (sans serveur backend)
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
            const filename = `affectations_accumulees_${timestamp}.xlsx`;
            
            // Créer le fichier Excel avec XLSX
            const ws = XLSX.utils.json_to_sheet(accumulatedData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Affectations");
            XLSX.writeFile(wb, filename);
            
            showSuccess('Export Excel réussi! Fichier téléchargé: ' + filename);
            
            // Essayer de sauvegarder sur le réseau si le serveur est disponible
            try {
                const response = await fetch('http://localhost:3000/api/save-excel-network', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: accumulatedData,
                        filename: filename.replace('.xlsx', '.csv')
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ Fichier également sauvegardé sur le réseau:', result.path);
                    showSuccess('Export Excel réussi! Fichier téléchargé et sauvegardé sur le réseau: ' + result.path);
                }
            } catch (networkError) {
                console.log('ℹ️ Serveur backend non disponible, export local uniquement');
                // Ne pas afficher d'erreur, l'export local a réussi
            }
        }

        // Réinitialiser le formulaire
        function handleReset() {
            if (confirm('Êtes-vous sûr de vouloir réinitialiser le formulaire?')) {
                document.getElementById('affectationForm').reset();
                document.getElementById('dateCreation').value = new Date().toISOString().split('T')[0];
                document.getElementById('supervision').disabled = true;
                document.getElementById('agence').disabled = true;
            }
        }

        // Afficher un message de succès
        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            successText.textContent = message;
            successMessage.classList.remove('hidden');
            
            setTimeout(() => {
                successMessage.classList.add('hidden');
            }, 3000);
        }
    </script>
